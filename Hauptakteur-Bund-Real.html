:root{
  --bg:#02060a;
  --surface:#071018;
  --surface2:#0a1b28;
  --line:rgba(0,204,255,.28);
  --cyan:#00ccff;
  --gold:#ffd700;
  --text:#eafcff;
  --muted:#9bc7d8;
  --blue:#0000aa;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f8f7;
    --surface:#ffffff;
    --surface2:#eef6f8;
    --text:#071018;
    --muted:#455c66;
    --line:rgba(0,80,120,.22);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Courier New",Courier,monospace
}

a{
  color:inherit
}

button{
  font:inherit
}

.mono{
  font-variant-numeric:tabular-nums
}

.paint-stage{
  transition:background 2.5s ease, color 2.5s ease
}

.paint-blue{
  background:#0000aa !important;
  color:white !important
}

.paint-blue .card-surface{
  background:#00048f !important;
  border-color:#ffd700 !important;
  color:white !important
}

.paint-blue .muted{
  color:#d8e8ff !important
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 rgba(0,204,255,.15)
  }

  50%{
    box-shadow:0 0 28px rgba(0,204,255,.35)
  }
}

@keyframes scan{
  from{
    transform:translateY(-100%)
  }

  to{
    transform:translateY(500%)
  }
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.rise{
  animation:rise .35s ease both
}

.boot-scan{
  position:relative;
  overflow:hidden
}

.boot-scan:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:24%;
  background:linear-gradient(transparent,rgba(0,204,255,.16),transparent);
  animation:scan 1.1s linear infinite;
  pointer-events:none
}

.cell-btn{
  aspect-ratio:1/1;
  min-width:0
}

.no-x{
  overflow-x:clip
}

::-webkit-scrollbar{
  width:10px;
  height:10px
}

::-webkit-scrollbar-thumb{
  background:#134a5e;
  border-radius:99px
}

::-webkit-scrollbar-track{
  background:transparent
}

.hover\:-translate-y-1:hover {
  --tw-translate-y: -0.25rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[\#ffd700\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(255 215 0 / var(--tw-border-opacity, 1));
}

.hover\:text-\[var\(--gold\)\]:hover {
  color: var(--gold);
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .md\:p-5 {
    padding: 1.25rem;
  }

  .md\:p-6 {
    padding: 1.5rem;
  }

  .md\:p-7 {
    padding: 1.75rem;
  }

  .md\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .md\:pt-12 {
    padding-top: 3rem;
  }

  .md\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .md\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .md\:text-5xl {
    font-size: 3rem;
    line-height: 1;
  }

  .md\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .md\:text-\[72px\] {
    font-size: 72px;
  }

  .md\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .md\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.1fr_\.9fr\] {
    grid-template-columns: 1.1fr .9fr;
  }

  .lg\:grid-cols-\[1\.25fr_\.75fr\] {
    grid-template-columns: 1.25fr .75fr;
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\] {
    grid-template-columns: 1.2fr .8fr;
  }
}
